name: Weekly Fetch & Rank

on:
  schedule:
    - cron: '10 5 * * 6'   # Fri 10:10 PM PT  — primary
    - cron: '10 7 * * 6'   # Fri 11:10 PM PT  — backup 1
    - cron: '10 9 * * 6'   # Sat 01:10 AM PT  — backup 2
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Skip if already ran today
        id: guard
        run: |
          LAST=$(python3 -c "import json; print(json.load(open('data.json'))['updated'])" 2>/dev/null || echo "")
          TODAY=$(date -u '+%a, %b %d, %Y')
          if [ "$LAST" = "$TODAY" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Already ran today — skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip == 'false'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.guard.outputs.skip == 'false'
        run: pip install -q -r requirements.txt

      - name: Run (attempt 1)
        if: steps.guard.outputs.skip == 'false'
        id: run1
        run: python fetch_and_rank.py
        continue-on-error: true

      - name: Run (attempt 2)
        if: steps.guard.outputs.skip == 'false' && steps.run1.outcome == 'failure'
        id: run2
        run: python fetch_and_rank.py
        continue-on-error: true

      - name: Run (attempt 3)
        if: steps.guard.outputs.skip == 'false' && steps.run2.outcome == 'failure'
        run: python fetch_and_rank.py

      - name: Verify data.json produced
        if: steps.guard.outputs.skip == 'false'
        run: |
          [ -f data.json ] || { echo "ERROR: data.json missing"; exit 1; }
          echo "data.json: $(wc -c < data.json) bytes"

      - name: Commit and push
        if: steps.guard.outputs.skip == 'false'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Weekly data update $(date -u '+%Y-%m-%d')"
          git push
